# c11n CI
#
# Four independent jobs:
#   - overlay: typecheck, build, and test the Vue overlay bundle; checks the
#     S4 supply-chain pins (scripts/check-pins.mjs); uploads the built
#     overlay.js as an artifact. Also lints the workflows.
#   - e2e:     the real verification. Runs the whole Playwright suite against
#     the full stack (PocketBase + Caddy + a demo upstream) on two
#     fixtures: `vite` (dev server) and `go` (the production topology).
#   - sasser:  the same proxy in front of the real dogfood app (ADR 0009),
#     huffduff/sasser-studios at the SASSER_REF pin, running only the
#     compatibility probe. Needs a read-only deploy key (secret
#     SASSER_DEPLOY_KEY) to check that private repo out; skipped with a
#     notice when the secret is absent (pull_request from a fork).
#   - docker:  smoke-builds both deploy images (deploy/caddy, deploy/pocketbase).
#     It only proves the Dockerfiles build — no container is run, so treat a
#     green docker job as "the images compile", not "the deployment works".

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repo. One secret is read: the
# sasser job's read-only deploy key (SASSER_DEPLOY_KEY), and only by that job.
permissions:
  contents: read

# A new push to the same branch makes the previous run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overlay:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: npm ci

      # S4 pins, checked without a browser or a stack: the Dockerfiles and
      # scripts/tools.env must agree, and the pocketbase zip must be verified
      # by checksum. (scripts/check-pins.mjs; no deps, milliseconds.)
      - name: Check supply-chain pins
        run: npm run check:pins

      # Lints every workflow in .github/. The config in
      # .github/actionlint.yaml declares the Blacksmith runner label (and is
      # only read because this step runs actionlint at all).
      - name: Lint workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint .github/workflows/ci.yml .github/workflows/release.yml

      - name: Typecheck overlay
        run: npm run typecheck -w packages/overlay

      # Build BEFORE test on purpose: test/mount-dist.spec skips when
      # packages/overlay/dist is absent locally but FAILS when it is absent
      # under CI. Building first means the dist smoke test runs against the
      # freshly built bundle.
      - name: Build overlay bundle
        run: npm run build -w packages/overlay

      - name: Test overlay (includes dist smoke test)
        run: npm test -w packages/overlay -- --run

      - name: Upload overlay.js artifact
        uses: actions/upload-artifact@v7
        with:
          name: overlay.js
          path: packages/overlay/dist/overlay.js
          if-no-files-found: error

  # The real verification: the whole suite against the whole stack, once per
  # topology. The actions are pinned to the same runner label as the other
  # jobs; no Docker daemon is involved (scripts/fetch-tools.sh builds Caddy
  # with xcaddy and downloads PocketBase).
  e2e:
    name: e2e (${{ matrix.fixture }})
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    strategy:
      # One fixture failing must not cancel the other: the point of the matrix
      # is to see which topology broke.
      fail-fast: false
      matrix:
        fixture: [vite, go]
    env:
      # globalSetup/globalTeardown read this to start and tear down the stack
      # for the right upstream (vite dev server vs. the Go production build).
      C11N_FIXTURE: ${{ matrix.fixture }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      # xcaddy (for the Caddy build) and the go fixture's server both need go.
      # setup-go reads `.tool-versions` (asdf format) — support landed in v6,
      # so v5 and older misparse the whole file as a version string.
      # Cache disabled on purpose: examples/demo-go-server is stdlib-only, so
      # there is no go.sum for setup-go to key a module cache on.
      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
          cache: false

      # The pinned binaries (.tools/caddy, .tools/pocketbase) are expensive to
      # build/download and depend only on scripts/tools.env.
      - uses: actions/cache@v6
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/tools.env') }}

      - name: Fetch pinned native tools
        run: scripts/fetch-tools.sh

      # Boots a scratch PocketBase with the migrations and an EMPTY hooks dir
      # (port 28095) to prove `comments.updateRule` alone still blocks
      # author/project/seq for non-authors. Cheap enough to run once per
      # fixture, which is where the pinned binary already is.
      - name: Rule floor without hooks
        run: node scripts/check-rule-floor.mjs

      # Applies the Phase 3 identity migration to a scratch DB that already has
      # users/comments in it, reverts it, and re-applies it (port 28197). e2e
      # always starts from an empty pb_data, so it cannot cover this.
      - name: Migrations up/down on a DB with data
        run: node scripts/check-migrations.mjs

      # Env validation: an out-of-range or non-integer
      # C11N_SESSION_TTL_DAYS / C11N_LINK_TTL_HOURS falls back to its default
      # and warns on stdout instead of failing every request later. No stack and
      # no browser, so it sits with the other scratch checks.
      - name: Env validation
        run: node scripts/check-env-validation.mjs

      # Backups: the env-driven settings hook, then a real local backup and
      # restore on a scratch database (no S3 bucket involved). Three scratch
      # PocketBases, no browser.
      - name: Backups (settings + local round trip)
        run: node scripts/check-backups.mjs

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx -w e2e playwright install --with-deps chromium

      - name: Build overlay bundle
        run: npm run build

      # C11N_FIXTURE comes from the job env; stack.sh builds the SPA and the Go
      # server itself for the go fixture.
      - name: Run e2e suite
        run: npm test -w e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.fixture }}
          path: |
            e2e/playwright-report
            e2e/test-results
            .stack/*.log
          if-no-files-found: ignore

  # The dogfood leg (ADR 0009): the same proxy in front of the real client app,
  # sasser-studios `frontend/` in Vite dev mode, running only the compatibility
  # probe (e2e/specs/upstream-compat.spec.ts, 8 tests).
  #
  # A job of its own, not a third matrix value in `e2e`: the checkout needs the
  # private repo's deploy key, and a matrix would put that secret in the
  # environment of the vite and go runners too. Separate jobs also keep the
  # matrix's name pattern: this one is `e2e (sasser)` by hand.
  #
  # The fixture-independent scratch checks (rule floor, migrations up/down, env
  # validation, backups) are deliberately not repeated here: they run on both
  # demo legs already and touch nothing sasser-specific.
  sasser:
    name: e2e (sasser)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    env:
      C11N_FIXTURE: sasser
      # scripts/stack.sh reads this instead of cloning the private repo itself;
      # it also refuses the run unless that checkout's HEAD is SASSER_REF and
      # its tracked files are clean.
      C11N_SASSER_DIR: ${{ github.workspace }}/.stack-sasser
    steps:
      - uses: actions/checkout@v7

      # SASSER_REF is read, never copied: the sha lives in scripts/tools.env
      # only, so bumping it there moves the checkout and the fixture's HEAD
      # assertion at the same time.
      - name: Read the pinned sasser commit
        id: pin
        run: |
          ref="$(awk -F= '$1 == "SASSER_REF" { print $2 }' scripts/tools.env)"
          if [ -z "$ref" ]; then
            echo "::error::SASSER_REF is missing from scripts/tools.env"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # A secret cannot be referenced from an `if:`, so its presence is decided
      # here and every step that needs it is gated on `has_key`. Forks get no
      # secrets on pull_request, hence the skip-with-notice instead of a red
      # job the contributor cannot fix.
      - name: Check for the sasser deploy key
        id: key
        env:
          SASSER_DEPLOY_KEY: ${{ secrets.SASSER_DEPLOY_KEY }}
        run: |
          if [ -n "$SASSER_DEPLOY_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=e2e (sasser) skipped::SASSER_DEPLOY_KEY is not available to this run; the sasser compatibility probe did not run."
            {
              echo "### e2e (sasser): skipped"
              echo ""
              echo "\`SASSER_DEPLOY_KEY\` is not available to this run (expected on \`pull_request\` from a fork),"
              echo "so the private sasser-studios checkout was skipped and the compatibility probe did not run."
              echo "The \`vite\` and \`go\` legs still cover the proxy; this leg is not evidence about the dogfood app."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Checked out at the repo root's sibling path, outside every npm workspace
      # pattern (packages/*, examples/*, e2e) and gitignored, so no c11n tool
      # (vitest, tsc, a check script) globs into the client's tree.
      # persist-credentials is off: the job never pushes, and the deploy key
      # must not stay behind in .git/config.
      - name: Check out sasser-studios at the pinned commit
        if: steps.key.outputs.has_key == 'true'
        uses: actions/checkout@v7
        with:
          repository: huffduff/sasser-studios
          ref: ${{ steps.pin.outputs.ref }}
          ssh-key: ${{ secrets.SASSER_DEPLOY_KEY }}
          persist-credentials: false
          path: .stack-sasser

      # Belt and braces with stack.sh's own check: the log line is the evidence
      # that the probe ran against exactly the pinned commit.
      - name: Verify the sasser checkout is at SASSER_REF
        if: steps.key.outputs.has_key == 'true'
        run: |
          head="$(git -C .stack-sasser rev-parse HEAD)"
          if [ "$head" != "${{ steps.pin.outputs.ref }}" ]; then
            echo "::error::sasser-studios is at $head, expected ${{ steps.pin.outputs.ref }}"
            exit 1
          fi
          echo "sasser-studios @ $head"
          git -C .stack-sasser log -1 --format='%s'

      - uses: actions/setup-node@v7
        if: steps.key.outputs.has_key == 'true'
        with:
          node-version-file: .tool-versions
          cache: npm
          # c11n's lockfile only: setup-node fails when a listed path does not
          # resolve, and .stack-sasser/ is absent on the skipped run. The cache
          # it configures is ~/.npm, which is the same cache the checkout's
          # `npm ci` (run by stack.sh) writes to, so sasser's tarballs are
          # restored too — just keyed on c11n's dependencies.
          cache-dependency-path: package-lock.json

      # xcaddy builds Caddy, so this leg needs the pinned go as well.
      - uses: actions/setup-go@v7
        if: steps.key.outputs.has_key == 'true'
        with:
          go-version-file: .tool-versions
          cache: false

      - uses: actions/cache@v6
        if: steps.key.outputs.has_key == 'true'
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/tools.env') }}

      - name: Fetch pinned native tools
        if: steps.key.outputs.has_key == 'true'
        run: scripts/fetch-tools.sh

      - name: Install dependencies
        if: steps.key.outputs.has_key == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.key.outputs.has_key == 'true'
        run: npx -w e2e playwright install --with-deps chromium

      - name: Build overlay bundle
        if: steps.key.outputs.has_key == 'true'
        run: npm run build

      # stack.sh's sasser_install_deps runs `npm ci` in the checkout root on
      # first use (frontend/ is that repo's npm workspace) and starts its vite
      # dev server on c11n's node.
      - name: Run the sasser compatibility probe
        if: steps.key.outputs.has_key == 'true'
        run: npm test -w e2e

      - name: Upload Playwright artifacts
        if: failure() && steps.key.outputs.has_key == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-sasser
          path: |
            e2e/playwright-report
            e2e/test-results
            .stack/*.log
          if-no-files-found: ignore

  # The Helm chart, verified without a cluster: lint, the render snapshots
  # (scripts/check-chart.mjs) and schema validation of every rendered object.
  chart:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions

      # Same pin as the other jobs' .tool-versions (helm 4.3.1); setup-helm
      # takes the bare version, so strip any leading v.
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      # kubeconform validates every rendered object against the Kubernetes
      # JSON schemas. Pinned: a new release changing its default schema
      # location would turn a green chart red for no chart-related reason.
      - name: Install kubeconform
        run: |
          curl -sSfL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Helm lint
        run: |
          for f in deploy/helm/c11n/ci/*.yaml; do
            helm lint deploy/helm/c11n --values "$f"
          done

      - name: Chart snapshots and required-input guards
        run: node scripts/check-chart.mjs

      - name: Validate rendered objects (kubeconform, strict)
        run: |
          for f in deploy/helm/c11n/ci/*.yaml; do
            echo "---- $f"
            helm template c11n deploy/helm/c11n --namespace c11n-ci --values "$f" \
              | kubeconform -strict -summary -kubernetes-version 1.34.0 -
          done

  # The images compile from a repo-root context (the caddy image builds the
  # overlay workspace). No container is run, so a green job still only means
  # "the images build".
  docker:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      # scripts/check-image-context.sh builds the overlay AND the demo upstream's
      # Go module (the same build examples/demo-go-server/Dockerfile runs), so it
      # needs the pinned go. No module cache: the server is stdlib-only.
      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
          cache: false

      # No daemon on the dev boxes, so the caddy build stage's COPY set is
      # proven natively: it copies exactly what the Dockerfile COPYs and runs
      # the same npm ci + build, then the demo server's go build. Catches a
      # missing COPY, a .dockerignore entry, or a WORKDIR outside the module.
      - name: Simulate the image build stages
        run: scripts/check-image-context.sh

      - name: Smoke-build caddy image
        run: docker build -f deploy/caddy/Dockerfile -t c11n-caddy:ci .

      - name: Smoke-build pocketbase image
        run: docker build -t c11n-pb:ci deploy/pocketbase
