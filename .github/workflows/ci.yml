# c11n CI
#
# Three independent jobs:
#   - overlay: typecheck, build, and test the Vue overlay bundle; checks the
#     S4 supply-chain pins (scripts/check-pins.mjs); uploads the built
#     overlay.js as an artifact. Also lints the workflows.
#   - e2e:     the real verification. Runs the whole Playwright suite against
#     the full stack (PocketBase + Caddy + a demo upstream) on two
#     fixtures: `vite` (dev server) and `go` (the production topology).
#   - docker:  smoke-builds both deploy images (deploy/caddy, deploy/pocketbase).
#     It only proves the Dockerfiles build — no container is run, so treat a
#     green docker job as "the images compile", not "the deployment works".

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repo or reads secrets.
permissions:
  contents: read

# A new push to the same branch makes the previous run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overlay:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: npm ci

      # S4 pins, checked without a browser or a stack: the Dockerfiles and
      # scripts/tools.env must agree, and the pocketbase zip must be verified
      # by checksum. (scripts/check-pins.mjs; no deps, milliseconds.)
      - name: Check supply-chain pins
        run: npm run check:pins

      # Lints every workflow in .github/. The config in
      # .github/actionlint.yaml declares the Blacksmith runner label (and is
      # only read because this step runs actionlint at all).
      - name: Lint workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint .github/workflows/ci.yml

      - name: Typecheck overlay
        run: npm run typecheck -w packages/overlay

      # Build BEFORE test on purpose: test/mount-dist.spec skips when
      # packages/overlay/dist is absent locally but FAILS when it is absent
      # under CI. Building first means the dist smoke test runs against the
      # freshly built bundle.
      - name: Build overlay bundle
        run: npm run build -w packages/overlay

      - name: Test overlay (includes dist smoke test)
        run: npm test -w packages/overlay -- --run

      - name: Upload overlay.js artifact
        uses: actions/upload-artifact@v7
        with:
          name: overlay.js
          path: packages/overlay/dist/overlay.js
          if-no-files-found: error

  # The real verification: the whole suite against the whole stack, once per
  # topology. The actions are pinned to the same runner label as the other
  # jobs; no Docker daemon is involved (scripts/fetch-tools.sh builds Caddy
  # with xcaddy and downloads PocketBase).
  e2e:
    name: e2e (${{ matrix.fixture }})
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    strategy:
      # One fixture failing must not cancel the other: the point of the matrix
      # is to see which topology broke.
      fail-fast: false
      matrix:
        fixture: [vite, go]
    env:
      # globalSetup/globalTeardown read this to start and tear down the stack
      # for the right upstream (vite dev server vs. the Go production build).
      C11N_FIXTURE: ${{ matrix.fixture }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      # xcaddy (for the Caddy build) and the go fixture's server both need go.
      # setup-go reads `.tool-versions` (asdf format) — support landed in v6,
      # so v5 and older misparse the whole file as a version string.
      # Cache disabled on purpose: examples/demo-go-server is stdlib-only, so
      # there is no go.sum for setup-go to key a module cache on.
      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
          cache: false

      # The pinned binaries (.tools/caddy, .tools/pocketbase) are expensive to
      # build/download and depend only on scripts/tools.env.
      - uses: actions/cache@v6
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/tools.env') }}

      - name: Fetch pinned native tools
        run: scripts/fetch-tools.sh

      # Boots a scratch PocketBase with the migrations and an EMPTY hooks dir
      # (port 28095) to prove `comments.updateRule` alone still blocks
      # author/project/seq for non-authors. Cheap enough to run once per
      # fixture, which is where the pinned binary already is.
      - name: Rule floor without hooks
        run: node scripts/check-rule-floor.mjs

      # Applies the Phase 3 identity migration to a scratch DB that already has
      # users/comments in it, reverts it, and re-applies it (port 28197). e2e
      # always starts from an empty pb_data, so it cannot cover this.
      - name: Migrations up/down on a DB with data
        run: node scripts/check-migrations.mjs

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx -w e2e playwright install --with-deps chromium

      - name: Build overlay bundle
        run: npm run build

      # C11N_FIXTURE comes from the job env; stack.sh builds the SPA and the Go
      # server itself for the go fixture.
      - name: Run e2e suite
        run: npm test -w e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.fixture }}
          path: |
            e2e/playwright-report
            e2e/test-results
            .stack/*.log
          if-no-files-found: ignore

  docker:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Smoke-build caddy image
        run: docker build -t c11n-caddy:ci deploy/caddy

      - name: Smoke-build pocketbase image
        run: docker build -t c11n-pb:ci deploy/pocketbase
