services:
  caddy:
    build: ./caddy
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - ../packages/overlay/dist:/srv/overlay:ro
    environment:
      - C11N_UPSTREAM=${C11N_UPSTREAM:-http://demo:5173}
    depends_on:
      - pocketbase
      - demo

  # The site under review. Any HTML upstream works; this demo runs the
  # examples/demo-vue dev server so the stack proves itself out of the box.
  # Point C11N_UPSTREAM elsewhere (and drop this service) to review your own app.
  demo:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ../examples/demo-vue:/app
    command: sh -c "npm install && npm run dev -- --host"
    expose:
      - "5173"

  pocketbase:
    build: ./pocketbase
    volumes:
      - pb_data:/pb/pb_data
      - ./pocketbase/pb_migrations:/pb/pb_migrations:ro
      - ./pocketbase/pb_hooks:/pb/pb_hooks:ro
    ports:
      # admin UI only; the API is same-origin via caddy at /__c11n/pb/
      - "8090:8090"

volumes:
  pb_data:
