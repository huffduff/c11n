services:
  caddy:
    # The build context is the repo root: the image compiles the overlay
    # workspace and bakes the bundle, the sign-in page and the Caddyfile in.
    build:
      context: ..
      dockerfile: deploy/caddy/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      # Compose is DEV ONLY (ADR 0005). The image already carries all three;
      # the bind mounts just keep a dev loop from rebuilding the image for
      # every overlay or sign-in change.
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - ../packages/overlay/dist:/srv/overlay:ro
      # The static sign-in page (task 3.7), served at /__c11n/auth/.
      - ../packages/signin:/srv/signin:ro
    environment:
      - C11N_UPSTREAM=${C11N_UPSTREAM:-http://demo:5173}
      # Caddy reads {$C11N_UPSTREAM_TLS:verify}, and an EMPTY value counts as
      # set (config load then fails: "File to import not found:
      # upstream_tls_"). The default keeps it non-empty; leave the variable
      # unset rather than empty.
      - C11N_UPSTREAM_TLS=${C11N_UPSTREAM_TLS:-verify}
      - C11N_SIGNIN_DIR=/srv/signin
    depends_on:
      - pocketbase
      - demo

  # The site under review. Any HTML upstream works; this demo runs the
  # examples/demo-vue dev server so the stack proves itself out of the box.
  # Point C11N_UPSTREAM elsewhere (and drop this service) to review your own app.
  demo:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ../examples/demo-vue:/app
    command: sh -c "npm install && npm run dev -- --host"
    expose:
      - "5173"

  pocketbase:
    build: ./pocketbase
    volumes:
      - pb_data:/pb/pb_data
      - ./pocketbase/pb_migrations:/pb/pb_migrations:ro
      - ./pocketbase/pb_hooks:/pb/pb_hooks:ro
    ports:
      # admin UI only; the API is same-origin via caddy at /__c11n/pb/
      - "8090:8090"
    environment:
      # Identity (ADR 0006). The first owner is created on a fresh database and
      # its one-time sign-in link is printed to the container log; see
      # docs/quickstart.md. Everything else is invited from the overlay.
      - C11N_OWNER_EMAIL=${C11N_OWNER_EMAIL:-owner@example.com}
      # Absolute invites are built from this origin; the default matches the
      # published caddy port above.
      - C11N_PUBLIC_URL=${C11N_PUBLIC_URL:-http://localhost:8080}
      - C11N_LINK_TTL_HOURS=${C11N_LINK_TTL_HOURS:-72}
      - C11N_SESSION_TTL_DAYS=${C11N_SESSION_TTL_DAYS:-14}
      # Keep true for any https review host. The local compose stack is served
      # on localhost, which browsers treat as trustworthy, so the default holds.
      - C11N_COOKIE_SECURE=${C11N_COOKIE_SECURE:-true}

volumes:
  pb_data:
