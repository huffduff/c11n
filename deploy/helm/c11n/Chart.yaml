apiVersion: v2
name: c11n
description: >-
  One stakeholder-review proxy for one reviewed site: a stateless Caddy
  Deployment (overlay bundle, sign-in page, forward_auth gate, upstream proxy)
  and a single-replica PocketBase StatefulSet with a PVC for pb_data, joined by
  ClusterIP Services and closed by NetworkPolicies. One release per reviewed
  site (ADR 0005).
type: application
# Chart version: bumped when the chart changes. appVersion is the IMAGE TAG
# both images default to, so cut it in step with the release tag (5.2).
version: 0.1.0
appVersion: "0.1.0"
# >=1.27 because the pocketbase StatefulSet sets
# persistentVolumeClaimRetentionPolicy (beta and on by default from 1.27; GA in
# 1.32). On an older cluster the field is dropped, and an uninstall would then
# delete pb_data instead of retaining it - which is exactly what this chart
# must not do silently.
kubeVersion: ">=1.27.0-0"
home: https://github.com/huffduff/c11n
sources:
  - https://github.com/huffduff/c11n
maintainers:
  - name: huffduff
annotations:
  c11n.io/adr: "ADR 0005 - one k8s deployment per reviewed site; caddy Deployment + pocketbase StatefulSet"
