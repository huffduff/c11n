---
# Source: c11n/templates/pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: c11n-pb-data
  labels:
    helm.sh/chart: "c11n-0.1.0"
    app.kubernetes.io/name: c11n
    app.kubernetes.io/instance: c11n
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: proxy
  annotations:
    # helm uninstall removes the release's objects but never a PVC's underlying
    # volume, so the data survives an uninstall. The claim also KEEPS the
    # release's ownership annotations, which is why a reinstall needs
    # `helm upgrade --install <rel> ... --take-ownership` (Helm 4): without it
    # helm refuses to adopt an object that belongs to a release it does not
    # know. Deleting the PVC is a separate, explicit step (docs/runbook.md §10).
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

