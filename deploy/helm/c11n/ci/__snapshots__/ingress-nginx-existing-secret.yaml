# Source: c11n/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: c11n
  labels:
    helm.sh/chart: "c11n-0.1.0"
    app.kubernetes.io/name: c11n
    app.kubernetes.io/instance: c11n
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: proxy
spec:
  # ClusterIP only: the Ingress is the public door, and the PocketBase admin is
  # reached with kubectl port-forward (NOTES.txt), not through this Service.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: c11n
    app.kubernetes.io/instance: c11n
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

---
# Source: c11n/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: c11n
  labels:
    helm.sh/chart: "c11n-0.1.0"
    app.kubernetes.io/name: c11n
    app.kubernetes.io/instance: c11n
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: proxy
spec:
  # HARDCODED, not a value: PocketBase is SQLite, which has a single writer.
  # Two pods against one PVC corrupt it, and two pods with two PVCs are two
  # different review sites. One review site = one release = one pod (ADR 0005).
  replicas: 1
  # Recreate, never RollingUpdate: the old pod must be gone before the new one
  # opens the database. An upgrade is therefore a short outage (documented in
  # the runbook).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: c11n
      app.kubernetes.io/instance: c11n
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c11n
        app.kubernetes.io/instance: c11n
      annotations:
        checksum/config: 5eca39bbe7eafb45bad9440a687bb780e16a095169cbf053d8be85a6148215ea
    spec:
      # Nothing in this pod talks to the Kubernetes API, so it has no token to
      # misuse if a container is compromised.
      automountServiceAccountToken: false
      # Both images run as 65532 (see their Dockerfiles). Numeric ids because
      # runAsNonRoot cannot verify a named user; fsGroup makes the PVC
      # writable for pocketbase without a chown.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - effect: NoSchedule
          key: review
          operator: Equal
          value: "true"
      containers:
        # ---- the proxy --------------------------------------------------
        - name: caddy
          image: "ghcr.io/huffduff/c11n-caddy:0.1.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Same pod network as pocketbase: loopback, no service hop.
            - name: C11N_PB_ADDR
              value: "127.0.0.1:8090"
            - name: C11N_UPSTREAM
              value: "https://10.20.30.40:8443"
            - name: C11N_UPSTREAM_TLS
              value: "insecure"
            # C11N_LISTEN, C11N_OVERLAY_DIR and C11N_SIGNIN_DIR are baked into
            # the image (:8080, /srv/overlay, /srv/signin) because the Caddyfile
            # and the assets ship together.
          # /__c11n/auth/ is the one route with no session gate in front of it
          # (it is the static sign-in page). /__c11n/overlay.js returns 401
          # without a session, so it cannot be a probe.
          readinessProbe:
            httpGet:
              path: /__c11n/auth/
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /__c11n/auth/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            # readOnlyRootFilesystem: Caddy still writes its autosave config
            # and any on-disk state under XDG_CONFIG_HOME/XDG_DATA_HOME
            # (/config, /data - set in the image), plus temp files in /tmp.
            - name: caddy-config
              mountPath: /config
            - name: caddy-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp

        # ---- the database, migrations, hooks and identity ---------------
        - name: pocketbase
          image: "ghcr.io/huffduff/c11n-pocketbase:0.1.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Spelled out rather than inherited from the image CMD: the chart
          # says exactly which dirs it expects, and a base image whose CMD
          # drifts cannot silently change where the data lives.
          args:
            - serve
            - --http=0.0.0.0:8090
            - --dir=/pb/pb_data
            - --migrationsDir=/pb/pb_migrations
            - --hooksDir=/pb/pb_hooks
          ports:
            - name: pb
              containerPort: 8090
              protocol: TCP
          env:
            # ---- identity (ADR 0006) ----
            - name: C11N_OWNER_EMAIL
              value: "owner@example.com"
            # Invite links are absolute: this is the origin they point at.
            - name: C11N_PUBLIC_URL
              value: "https://review.example.com"
            - name: C11N_SESSION_TTL_DAYS
              value: "7"
            - name: C11N_LINK_TTL_HOURS
              value: "24"
            - name: C11N_INVITE_RATE_PER_HOUR
              value: "100"
            - name: C11N_COOKIE_SECURE
              value: "true"
            # ---- scheduled backups (5.4) ----
            # Read once, on the first request, by pb_hooks/settings.pb.js.
            # Empty cron = the hook leaves PocketBase's settings alone.
            - name: C11N_BACKUP_CRON
              value: "0 3 * * *"
            - name: C11N_BACKUP_KEEP
              value: "14"
            - name: C11N_BACKUP_S3_ENDPOINT
              value: "https://s3.eu-central-1.amazonaws.com"
            - name: C11N_BACKUP_S3_BUCKET
              value: "c11n-review-backups"
            - name: C11N_BACKUP_S3_REGION
              value: "eu-central-1"
            - name: C11N_BACKUP_S3_FORCE_PATH_STYLE
              value: "false"
            - name: C11N_BACKUP_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: c11n-secrets
                  key: backup-s3-access-key
            - name: C11N_BACKUP_S3_SECRET
              valueFrom:
                secretKeyRef:
                  name: c11n-secrets
                  key: backup-s3-secret-key
            # ---- SMTP (POST-MVP, INERT) ----
            # Nothing reads these yet: invites are copy-the-link (ADR 0006).
            # Wired now so turning on mail later is a values change.
            - name: C11N_SMTP_HOST
              value: "smtp.example.com"
            - name: C11N_SMTP_PORT
              value: "587"
            - name: C11N_SMTP_USERNAME
              value: "c11n"
            - name: C11N_SMTP_FROM
              value: "c11n@example.com"
            - name: C11N_SMTP_TLS
              value: "true"
            - name: C11N_SMTP_AUTH
              value: "true"
            - name: C11N_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: c11n-secrets
                  key: smtp-password
            - name: TZ
              value: UTC
          # /api/health answers as soon as the HTTP server is up. On a FRESH
          # database the pending migrations run at boot first, so the startup
          # probe is generous: it is the migration window, not a hang.
          startupProbe:
            httpGet:
              path: /api/health
              port: pb
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: pb
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: pb
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: pb-data
              mountPath: /pb/pb_data
            # readOnlyRootFilesystem: temp files (zip export during a backup,
            # uploads in flight) go to /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: pb-data
          persistentVolumeClaim:
            claimName: c11n-pb-data
        - name: caddy-config
          emptyDir: {}
        - name: caddy-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}

---
# Source: c11n/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: c11n
  labels:
    helm.sh/chart: "c11n-0.1.0"
    app.kubernetes.io/name: c11n
    app.kubernetes.io/instance: c11n
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: proxy
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 16m
spec:
  ingressClassName: "nginx"
  rules:
    - host: "review.example.com"
      http:
        paths:
          # Everything goes to caddy. It gates, injects the overlay, proxies
          # the reviewed upstream, and answers the PocketBase admin path with
          # 404 - there is no host-level split between admin and review.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: c11n
                port:
                  name: http
  tls:
    - hosts:
        - "review.example.com"
      secretName: "review-example-com-tls"
