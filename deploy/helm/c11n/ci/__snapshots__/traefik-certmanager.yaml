# Source: c11n/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: c11n-caddy
  labels:
    helm.sh/chart: "c11n-0.1.0"
    app.kubernetes.io/name: c11n
    app.kubernetes.io/instance: c11n
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: caddy
  annotations:
    c11n.io/why: >-
      The review origin answers only the ingress controller (plus any CIDR or
      pod selector the operator adds). Egress is unrestricted on purpose: the
      proxy has to reach the reviewed upstream and PocketBase.
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: c11n
      app.kubernetes.io/instance: c11n
      app.kubernetes.io/component: caddy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "kube-system"
      ports:
        - protocol: TCP
          port: 8080

