# Source: c11n/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: c11n-pocketbase
  labels:
    helm.sh/chart: "c11n-0.1.0"
    app.kubernetes.io/name: c11n
    app.kubernetes.io/instance: c11n
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: pocketbase
  annotations:
    c11n.io/why: >-
      Only caddy pods (and the ingress controller, when the admin Ingress is
      enabled) may reach PocketBase on 8090. PocketBase has no business being
      reachable from every pod in the cluster.
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: c11n
      app.kubernetes.io/instance: c11n
      app.kubernetes.io/component: pocketbase
  policyTypes:
    - Ingress
  ingress:
    # (a) the proxy. A bare podSelector means "in THIS namespace", which is
    # what makes this safe: another release's caddy pods carry a different
    # app.kubernetes.io/instance and never match.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: c11n
              app.kubernetes.io/instance: c11n
              app.kubernetes.io/component: caddy
      ports:
        - protocol: TCP
          port: 8090

