# Source: c11n/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: c11n-pocketbase-headless
  labels:
    helm.sh/chart: "c11n-0.1.0"
    app.kubernetes.io/name: c11n
    app.kubernetes.io/instance: c11n
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: pocketbase
spec:
  # Governs the StatefulSet: pod 0 gets <pod>.<service>.<ns>.svc. No traffic
  # goes through it (a headless Service resolves to pod IPs and nothing else),
  # which is why caddy addresses the ClusterIP Service above instead.
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: c11n
    app.kubernetes.io/instance: c11n
    app.kubernetes.io/component: pocketbase
  ports:
    - name: pb
      port: 8090
      targetPort: pb
      protocol: TCP

