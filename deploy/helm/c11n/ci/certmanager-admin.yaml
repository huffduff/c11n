# Chart verification values: cert-manager + the admin UI published + the
# NetworkPolicy narrowed to the controller's pods.
#
# What this file exists for:
#   * the admin Ingress gets its OWN TLS Secret. cert-manager writes one
#     certificate per Secret, so a shared name means the two Ingresses overwrite
#     each other's certificate. check-chart asserts the two names differ.
#   * the admin Ingress points at the pocketbase Service, and the NetworkPolicy
#     therefore has to allow the ingress controller to reach 8090 - the only
#     case where it does.
#   * caddy scaled to 2 with a PodDisruptionBudget: the one shape where the
#     budget is not a drain-blocking mistake.
# The image digests prove `digest` wins over `tag` and renders repo@digest.
host: review.example.com

upstream:
  url: https://staging.example.com

owner:
  email: owner@example.com

ingress:
  className: traefik

tls:
  mode: certManager
  issuer: letsencrypt-prod

adminIngress:
  enabled: true
  host: admin.review.example.com

networkPolicy:
  enabled: true
  ingressNamespace: kube-system
  ingressPodSelector:
    app.kubernetes.io/name: traefik
  additionalAllowedCidrs:
    - 10.0.0.0/8

caddy:
  replicas: 2
  pdb:
    enabled: true
  image:
    digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
pocketbase:
  image:
    digest: sha256:2222222222222222222222222222222222222222222222222222222222222222

persistence:
  storageClass: local-path
  size: 5Gi
