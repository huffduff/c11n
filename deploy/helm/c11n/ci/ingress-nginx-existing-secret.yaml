# Chart verification values: ingress-nginx + an operator-supplied certificate.
#
# Also exercises the parts of the chart that are easy to leave unrendered:
# extra ingress annotations, an https upstream with an unverifiable
# certificate, the S3 backup Secret, the (inert) SMTP env wiring, and
# per-component placement on top of the top-level nodeSelector/tolerations.
#
# networkPolicy is on by default (k3s/Traefik lives in kube-system); an
# ingress-nginx cluster has to point it at ingress-nginx or every request is a
# 504. This file is the one that documents that.
host: review.example.com

upstream:
  url: https://10.20.30.40:8443
  tls: insecure

owner:
  email: owner@example.com

session:
  ttlDays: 7

invite:
  ttlHours: 24
  ratePerHour: 100

ingress:
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 16m

tls:
  mode: existingSecret
  secretName: review-example-com-tls

persistence:
  size: 20Gi

backup:
  cron: "0 3 * * *"
  keep: 14
  s3:
    endpoint: https://s3.eu-central-1.amazonaws.com
    bucket: c11n-review-backups
    region: eu-central-1
    accessKey: EXAMPLEACCESSKEY
    secretKey: EXAMPLESECRETKEY
    forcePathStyle: false

smtp:
  enabled: true
  host: smtp.example.com
  port: 587
  username: c11n
  password: EXAMPLESMTPPASSWORD
  from: c11n@example.com

nodeSelector:
  kubernetes.io/os: linux

tolerations:
  - key: review
    operator: Equal
    value: "true"
    effect: NoSchedule

networkPolicy:
  ingressNamespace: ingress-nginx

# Per-component override on top of the top-level placement above: the database
# is pinned to the node pool with the fast disk, caddy is not.
pocketbase:
  nodeSelector:
    kubernetes.io/os: linux
    c11n.io/disk: fast
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 768Mi
