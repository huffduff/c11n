# Chart verification values: no cluster TLS, admin UI published.
#
# The closedcloud test-cluster shape (5.5): plain http behind Traefik with
# cookie.secure=false, no backups, and an admin Ingress so the render covers
# the second Ingress and the NetworkPolicy's 8090 rule. networkPolicy is left
# at its default (on, kube-system): this is the file that proves the default.
host: c11n.closedcloud.test

publicUrl: http://c11n.closedcloud.test

upstream:
  url: http://demo:15174

owner:
  email: owner@c11n.test

cookie:
  secure: false

ingress:
  className: traefik

tls:
  mode: none

persistence:
  size: 1Gi

# The closedcloud nodes are t4g.medium (2 vCPU / 4 GiB, arm64): small requests
# so a two-container pod plus the demo upstream schedules comfortably.
resources:
  caddy:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  pocketbase:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi

adminIngress:
  enabled: true
  host: admin.c11n.closedcloud.test
