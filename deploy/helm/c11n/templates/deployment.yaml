{{- include "c11n.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "c11n.fullname" . }}
  labels:
    {{- include "c11n.labels" . | nindent 4 }}
spec:
  # HARDCODED, not a value: PocketBase is SQLite, which has a single writer.
  # Two pods against one PVC corrupt it, and two pods with two PVCs are two
  # different review sites. One review site = one release = one pod (ADR 0005).
  replicas: 1
  # Recreate, never RollingUpdate: the old pod must be gone before the new one
  # opens the database. An upgrade is therefore a short outage (documented in
  # the runbook).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "c11n.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "c11n.selectorLabels" . | nindent 8 }}
      annotations:
        {{- /*
        podAnnotations FIRST, checksum/config LAST: set() overwrites, so a user
        annotation named checksum/config is replaced rather than emitted twice
        (a duplicate key is rejected by the YAML parser before the object exists).
        Restart the pod when the configuration changes: a changed upstream, host
        or TTL must take effect on upgrade, and env is only read at process start.
        */}}
        {{- $annotations := deepCopy (.Values.podAnnotations | default dict) }}
        {{- $_ := set $annotations "checksum/config" (.Values | toJson | sha256sum) }}
        {{- toYaml $annotations | nindent 8 }}
    spec:
      # Nothing in this pod talks to the Kubernetes API, so it has no token to
      # misuse if a container is compromised.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Both images run as 65532 (see their Dockerfiles). Numeric ids because
      # runAsNonRoot cannot verify a named user; fsGroup makes the PVC
      # writable for pocketbase without a chown.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        # ---- the proxy --------------------------------------------------
        - name: caddy
          image: {{ include "c11n.caddyImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Same pod network as pocketbase: loopback, no service hop.
            - name: C11N_PB_ADDR
              value: "127.0.0.1:8090"
            - name: C11N_UPSTREAM
              value: {{ .Values.upstream.url | quote }}
            - name: C11N_UPSTREAM_TLS
              value: {{ .Values.upstream.tls | quote }}
            # C11N_LISTEN, C11N_OVERLAY_DIR and C11N_SIGNIN_DIR are baked into
            # the image (:8080, /srv/overlay, /srv/signin) because the Caddyfile
            # and the assets ship together.
          # /__c11n/auth/ is the one route with no session gate in front of it
          # (it is the static sign-in page). /__c11n/overlay.js returns 401
          # without a session, so it cannot be a probe.
          readinessProbe:
            httpGet:
              path: /__c11n/auth/
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /__c11n/auth/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.caddy | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem: Caddy still writes its autosave config
            # and any on-disk state under XDG_CONFIG_HOME/XDG_DATA_HOME
            # (/config, /data - set in the image), plus temp files in /tmp.
            - name: caddy-config
              mountPath: /config
            - name: caddy-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp

        # ---- the database, migrations, hooks and identity ---------------
        - name: pocketbase
          image: {{ include "c11n.pocketbaseImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Spelled out rather than inherited from the image CMD: the chart
          # says exactly which dirs it expects, and a base image whose CMD
          # drifts cannot silently change where the data lives.
          args:
            - serve
            - --http=0.0.0.0:8090
            - --dir=/pb/pb_data
            - --migrationsDir=/pb/pb_migrations
            - --hooksDir=/pb/pb_hooks
          ports:
            - name: pb
              containerPort: 8090
              protocol: TCP
          env:
            # ---- identity (ADR 0006) ----
            - name: C11N_OWNER_EMAIL
              value: {{ .Values.owner.email | quote }}
            # Invite links are absolute: this is the origin they point at.
            - name: C11N_PUBLIC_URL
              value: {{ include "c11n.publicUrl" . | quote }}
            - name: C11N_SESSION_TTL_DAYS
              value: {{ .Values.session.ttlDays | quote }}
            - name: C11N_LINK_TTL_HOURS
              value: {{ .Values.invite.ttlHours | quote }}
            - name: C11N_INVITE_RATE_PER_HOUR
              value: {{ .Values.invite.ratePerHour | quote }}
            - name: C11N_COOKIE_SECURE
              value: {{ .Values.cookie.secure | quote }}
            # ---- scheduled backups (5.4) ----
            # Read once, on the first request, by pb_hooks/settings.pb.js.
            # Empty cron = the hook leaves PocketBase's settings alone.
            - name: C11N_BACKUP_CRON
              value: {{ .Values.backup.cron | quote }}
            - name: C11N_BACKUP_KEEP
              value: {{ .Values.backup.keep | quote }}
            {{- if .Values.backup.cron }}
            - name: C11N_BACKUP_S3_ENDPOINT
              value: {{ .Values.backup.s3.endpoint | quote }}
            - name: C11N_BACKUP_S3_BUCKET
              value: {{ .Values.backup.s3.bucket | quote }}
            - name: C11N_BACKUP_S3_REGION
              value: {{ .Values.backup.s3.region | quote }}
            - name: C11N_BACKUP_S3_FORCE_PATH_STYLE
              value: {{ .Values.backup.s3.forcePathStyle | quote }}
            - name: C11N_BACKUP_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "c11n.fullname" . }}-secrets
                  key: backup-s3-access-key
            - name: C11N_BACKUP_S3_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "c11n.fullname" . }}-secrets
                  key: backup-s3-secret-key
            {{- end }}
            # ---- SMTP (POST-MVP, INERT) ----
            # Nothing reads these yet: invites are copy-the-link (ADR 0006).
            # Wired now so turning on mail later is a values change.
            {{- if .Values.smtp.enabled }}
            - name: C11N_SMTP_HOST
              value: {{ .Values.smtp.host | quote }}
            - name: C11N_SMTP_PORT
              value: {{ .Values.smtp.port | quote }}
            - name: C11N_SMTP_USERNAME
              value: {{ .Values.smtp.username | quote }}
            - name: C11N_SMTP_FROM
              value: {{ .Values.smtp.from | quote }}
            - name: C11N_SMTP_TLS
              value: {{ .Values.smtp.tls | quote }}
            - name: C11N_SMTP_AUTH
              value: {{ .Values.smtp.authEnabled | quote }}
            {{- /* Only when there is one: with authEnabled=false there is no
            password, and a secretKeyRef to a missing key is a pod that cannot
            start. c11n.validate fails the render when authEnabled=true and it is
            empty, so this branch is "no auth" or "password present". */}}
            {{- if .Values.smtp.password }}
            - name: C11N_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "c11n.fullname" . }}-secrets
                  key: smtp-password
            {{- end }}
            {{- end }}
            - name: TZ
              value: UTC
          # /api/health answers as soon as the HTTP server is up. On a FRESH
          # database the pending migrations run at boot first, so the startup
          # probe is generous: it is the migration window, not a hang.
          startupProbe:
            httpGet:
              path: /api/health
              port: pb
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: pb
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: pb
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.pocketbase | nindent 12 }}
          volumeMounts:
            - name: pb-data
              mountPath: /pb/pb_data
            # readOnlyRootFilesystem: temp files (zip export during a backup,
            # uploads in flight) go to /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: pb-data
          persistentVolumeClaim:
            claimName: {{ include "c11n.fullname" . }}-pb-data
        - name: caddy-config
          emptyDir: {}
        - name: caddy-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
