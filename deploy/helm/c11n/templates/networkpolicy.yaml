{{- if .Values.networkPolicy.enabled }}
{{- include "c11n.validate" . }}
{{- /*
The pod has two listening ports: caddy on 8080 (the review origin, behind the
Ingress) and pocketbase on 8090. 8090 has no Service unless adminIngress is on,
but a Service is not required to reach a pod: ANY pod in the cluster can dial
<podIP>:8090 and talk to the PocketBase API with a stolen or guessed token
(allowed by the collection rules), so the admin port is cluster-wide by default.

This policy closes that: ingress is allowed only on the caddy port, and only
from the ingress controller's namespace (matched on the namespace label
Kubernetes adds automatically). Nothing here restricts egress, so DNS and the
S3 endpoint still work. It is off by default because a wrong selector or a CNI
that does not enforce policies turns this into an outage.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "c11n.fullname" . }}
  labels:
    {{- include "c11n.labels" . | nindent 4 }}
  annotations:
    c11n.io/why: >-
      Ingress to this pod is limited to the caddy port from the ingress
      controller namespace; PocketBase's 8090 is otherwise reachable on the pod
      IP from anywhere in the cluster.
spec:
  podSelector:
    matchLabels:
      {{- include "c11n.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace | quote }}
          {{- with .Values.networkPolicy.ingressPodSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
        {{- with .Values.networkPolicy.additionalAllowedCidrs }}
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
        {{- if .Values.adminIngress.enabled }}
        # The admin Ingress is an explicit opt-in that publishes 8090; it comes
        # in through the same controller, so the same source is allowed on it.
        - protocol: TCP
          port: 8090
        {{- end }}
{{- end }}
