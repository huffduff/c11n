{{- include "c11n.validate" . }}
{{- $name := include "c11n.fullname" . }}
{{- /*
The database, migrations, hooks and identity. A StatefulSet of exactly ONE pod,
with its own volumeClaimTemplate: pb_data is SQLite and pocketbase is the only
process that may open it.

Not a Deployment with a PVC: a StatefulSet is the k8s object that owns "one
pod, one claim, delete them together on purpose" - the claim name is derived
(pb-data-<sts>-0) and persistentVolumeClaimRetentionPolicy says what happens to
it. The single-replica PVC with helm.sh/resource-policy: keep this chart used to
render is gone: a claim inside a StatefulSet is retained by that policy, not by
a Helm annotation that only ever protected it from `helm uninstall`.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}-pocketbase
  labels:
    {{- include "c11n.componentLabels" (dict "root" . "component" "pocketbase") | nindent 4 }}
spec:
  # HARDCODED, NOT A VALUE - do not expose this as one. PocketBase is SQLite:
  # a single writer. Two pods on one volume corrupt it; two pods on two volumes
  # are two different review sites. One reviewed site = one release = one
  # pocketbase pod (ADR 0005). check-chart asserts that no values file can move
  # this off 1.
  replicas: 1
  # OrderedReady is the StatefulSet default and is spelled out because it is
  # load-bearing: pod 0 is created, becomes Ready, and only then would pod 1 be
  # (there is never a pod 1 - see replicas above).
  podManagementPolicy: OrderedReady
  # The headless Service that gives the pod its stable DNS name
  # (<pod>.<service>.<ns>.svc). PocketBase does not need it to serve, but a
  # StatefulSet requires a governing Service and caddy's Service is not it.
  serviceName: {{ $name }}-pocketbase-headless
  # Retain / Retain: scaling this (which would be a mistake) and deleting the
  # StatefulSet (which `helm uninstall` does) both leave pb_data's claim and
  # volume behind. Deleting the data is then one explicit `kubectl delete pvc`,
  # never a side effect of an uninstall. See docs/runbook.md sections 4 and 10.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "c11n.componentSelector" (dict "root" . "component" "pocketbase") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "c11n.componentSelector" (dict "root" . "component" "pocketbase") | nindent 8 }}
      annotations:
        {{- /*
        podAnnotations FIRST, checksum/config LAST (set() overwrites, so a user
        annotation of that name is replaced, not duplicated).

        This checksum covers the values PocketBase reads: identity, sessions,
        invites, the cookie flag, the public origin, backups, SMTP and the
        image. It deliberately does NOT include caddy's values or
        persistence.size, so changing either does not restart the database.
        */}}
        {{- $config := dict
              "host" .Values.host
              "publicUrl" .Values.publicUrl
              "owner" .Values.owner
              "session" .Values.session
              "invite" .Values.invite
              "cookie" .Values.cookie
              "backup" .Values.backup
              "smtp" .Values.smtp
              "image" .Values.pocketbase.image }}
        {{- $annotations := deepCopy (.Values.podAnnotations | default dict) }}
        {{- $_ := set $annotations "checksum/config" ($config | toJson | sha256sum) }}
        {{- toYaml $annotations | nindent 8 }}
    spec:
      # Nothing in this pod talks to the Kubernetes API.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Both images run as 65532 (see their Dockerfiles). Numeric ids because
      # runAsNonRoot cannot verify a named user; fsGroup makes the volume
      # writable for pocketbase without a chown.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with (.Values.pocketbase.nodeSelector | default .Values.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.pocketbase.affinity | default .Values.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.pocketbase.tolerations | default .Values.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: pocketbase
          image: {{ include "c11n.pocketbaseImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Explicit command AND args, never args alone: Kubernetes REPLACES
          # the image CMD with `args`, so args without a command leave the
          # kubelet exec'ing the first arg ("exec: \"serve\": executable file
          # not found in $PATH", found on k3s). The absolute path also makes the
          # pod independent of the image's ENTRYPOINT, PATH and WORKDIR, and the
          # dirs are spelled out so a base image whose CMD drifts cannot move
          # where the data lives.
          command:
            - /pb/pocketbase
          args:
            - serve
            - --http=0.0.0.0:8090
            - --dir=/pb/pb_data
            - --migrationsDir=/pb/pb_migrations
            - --hooksDir=/pb/pb_hooks
          ports:
            - name: pb
              containerPort: 8090
              protocol: TCP
          env:
            # ---- identity (ADR 0006) ----
            - name: C11N_OWNER_EMAIL
              value: {{ .Values.owner.email | quote }}
            # Invite links are absolute: this is the origin they point at.
            - name: C11N_PUBLIC_URL
              value: {{ include "c11n.publicUrl" . | quote }}
            - name: C11N_SESSION_TTL_DAYS
              value: {{ .Values.session.ttlDays | quote }}
            - name: C11N_LINK_TTL_HOURS
              value: {{ .Values.invite.ttlHours | quote }}
            - name: C11N_INVITE_RATE_PER_HOUR
              value: {{ .Values.invite.ratePerHour | quote }}
            - name: C11N_COOKIE_SECURE
              value: {{ .Values.cookie.secure | quote }}
            # ---- scheduled backups (5.4) ----
            # Read once, on the first request, by pb_hooks/settings.pb.js.
            # Empty cron = the hook leaves PocketBase's settings alone.
            - name: C11N_BACKUP_CRON
              value: {{ .Values.backup.cron | quote }}
            - name: C11N_BACKUP_KEEP
              value: {{ .Values.backup.keep | quote }}
            {{- if .Values.backup.cron }}
            - name: C11N_BACKUP_S3_ENDPOINT
              value: {{ .Values.backup.s3.endpoint | quote }}
            - name: C11N_BACKUP_S3_BUCKET
              value: {{ .Values.backup.s3.bucket | quote }}
            - name: C11N_BACKUP_S3_REGION
              value: {{ .Values.backup.s3.region | quote }}
            - name: C11N_BACKUP_S3_FORCE_PATH_STYLE
              value: {{ .Values.backup.s3.forcePathStyle | quote }}
            - name: C11N_BACKUP_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-secrets
                  key: backup-s3-access-key
            - name: C11N_BACKUP_S3_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-secrets
                  key: backup-s3-secret-key
            {{- end }}
            # ---- SMTP (POST-MVP, INERT) ----
            # Nothing reads these yet: invites are copy-the-link (ADR 0006).
            # Wired now so turning on mail later is a values change.
            {{- if .Values.smtp.enabled }}
            - name: C11N_SMTP_HOST
              value: {{ .Values.smtp.host | quote }}
            - name: C11N_SMTP_PORT
              value: {{ .Values.smtp.port | quote }}
            - name: C11N_SMTP_USERNAME
              value: {{ .Values.smtp.username | quote }}
            - name: C11N_SMTP_FROM
              value: {{ .Values.smtp.from | quote }}
            - name: C11N_SMTP_TLS
              value: {{ .Values.smtp.tls | quote }}
            - name: C11N_SMTP_AUTH
              value: {{ .Values.smtp.authEnabled | quote }}
            {{- /* Only when there is one: with authEnabled=false there is no
            password, and a secretKeyRef to a missing key is a pod that cannot
            start. c11n.validate fails the render when authEnabled=true and it is
            empty, so this branch is "no auth" or "password present". */}}
            {{- if .Values.smtp.password }}
            - name: C11N_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-secrets
                  key: smtp-password
            {{- end }}
            {{- end }}
            - name: TZ
              value: UTC
          # /api/health answers as soon as the HTTP server is up. On a FRESH
          # database the pending migrations run at boot first, so the startup
          # probe is generous: it is the migration window, not a hang.
          #
          # These probes ARE the owner bootstrap: the first request creates the
          # owner and prints its link (NOTES.txt, runbook section 2). Caddy's
          # forward_auth also issues requests, so a restart with a probe that
          # never fired still bootstraps on the first page view.
          startupProbe:
            httpGet:
              path: /api/health
              port: pb
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: pb
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: pb
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with (.Values.pocketbase.resources | default .Values.resources.pocketbase) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: pb-data
              mountPath: /pb/pb_data
            # readOnlyRootFilesystem: temp files (the zip staged during a
            # backup, uploads in flight) go to /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  # The reviewed site's data. Named (not generated) so the claim is
  # pb-data-<sts>-0, i.e. c11n-pocketbase-0 -> c11n-pb-data-c11n-pocketbase-0
  # for a release called c11n. Size and class come from persistence.*, and a
  # change to SIZE only affects a newly created claim (Kubernetes has no
  # shrink and StatefulSets do not re-render existing claims): to grow it, edit
  # the PVC or delete and re-create it from a backup. docs/runbook.md section 5.
  volumeClaimTemplates:
    - metadata:
        name: pb-data
        labels:
          {{- include "c11n.componentLabels" (dict "root" . "component" "pocketbase") | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
