{{- /* pb_data: the only stateful thing in the deployment (SQLite). */}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "c11n.fullname" . }}-pb-data
  labels:
    {{- include "c11n.labels" . | nindent 4 }}
  annotations:
    # helm uninstall removes the release's objects but never a PVC's
    # underlying volume: the data survives an uninstall and a reinstall
    # re-adopts this claim. Deleting the PVC is a separate, explicit step
    # (docs/runbook.md).
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
