{{- if or .Values.backup.s3.accessKey .Values.smtp.password }}
{{- /*
Chart-managed Secret for the only two credentials the pod needs. Kept out of
the Deployment's env block so the values never show up in a container spec
(kubectl describe, a copy-pasted manifest), and out of the ConfigMap-land of
plain values. Helm still stores the release's values in a Secret, so this is
about blast radius, not about hiding the value from the cluster.

data:, not stringData: with b64enc. stringData would put the plaintext in every
rendered manifest (helm template output, CI logs, git diffs of a rendered set);
the API server base64-decodes data: on write, so the stored object is identical
without that trail. Base64 is encoding, not encryption - see values.yaml.

Rendered exactly when the Deployment references a key here (c11n.validate
guarantees secretKey is set whenever backup.cron is), so a secretKeyRef can
never point at a Secret that does not exist.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "c11n.fullname" . }}-secrets
  labels:
    {{- include "c11n.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.backup.s3.accessKey }}
  backup-s3-access-key: {{ .Values.backup.s3.accessKey | b64enc | quote }}
  backup-s3-secret-key: {{ .Values.backup.s3.secretKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.smtp.password }}
  smtp-password: {{ .Values.smtp.password | b64enc | quote }}
  {{- end }}
{{- end }}
