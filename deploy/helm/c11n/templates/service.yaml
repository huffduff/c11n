apiVersion: v1
kind: Service
metadata:
  name: {{ include "c11n.fullname" . }}
  labels:
    {{- include "c11n.labels" . | nindent 4 }}
spec:
  # ClusterIP only: the Ingress is the public door, and the PocketBase admin is
  # reached with kubectl port-forward (NOTES.txt), not through this Service.
  type: ClusterIP
  selector:
    {{- include "c11n.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    {{- if .Values.adminIngress.enabled }}
    # Only when the admin Ingress is explicitly enabled does the admin port
    # become reachable through a Service at all. It is a real risk: see the
    # warning on the Ingress below and in values.yaml.
    - name: pb-admin
      port: 8090
      targetPort: pb
      protocol: TCP
    {{- end }}
