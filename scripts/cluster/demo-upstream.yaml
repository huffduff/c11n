# The demo upstream from examples/demo-go-server, for the closedcloud test
# cluster (Phase 5 task 5.5).
#
# It exists so a freshly installed c11n has something real to proxy: the same
# Go server the `go` e2e fixture runs locally, serving the built demo-vue SPA.
# The e2e suite's `go` topology specs run against it through the ingress.
#
# __DEMO_IMAGE__ is replaced by scripts/cluster/install-closedcloud.sh with the
# repository:tag that `closedcloud build` returned (no imagePullSecrets: the
# in-cluster registry needs none).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  labels:
    app.kubernetes.io/name: demo
    app.kubernetes.io/part-of: c11n-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo
        app.kubernetes.io/part-of: c11n-test
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo
          image: __DEMO_IMAGE__
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 15174
          env:
            - name: C11N_GO_ADDR
              value: "0.0.0.0:15174"
            - name: C11N_GO_DIST
              value: /srv/demo
          # The closedcloud workers are t4g.medium: keep the demo tiny so it
          # never competes with the two c11n containers for cpu.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: demo
  labels:
    app.kubernetes.io/name: demo
    app.kubernetes.io/part-of: c11n-test
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: demo
  ports:
    - name: http
      port: 15174
      targetPort: http
